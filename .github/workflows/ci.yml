# CI. Pull requests verify the affected projects only; pushes to main and
# release verify everything. release.yml calls this workflow
# (workflow_call) as its gate.
#
# The pull-request job names (verify-affected, e2e-affected) are the required
# status checks in the main and release rulesets: keep them stable. They only
# run on pull requests, so a push to main never reports them.
name: ci

on:
  pull_request:
  push:
    branches: [main, release]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-affected:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nx affected needs history back to the PR base
      - uses: pnpm/action-setup@v4 # version from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # UI libraries: Storybook's axe test-runner needs browsers. The
      # test-storybook target must be self-contained: build the static
      # Storybook, serve it, scan every story, stop the server.
      - run: pnpm exec playwright install --with-deps chromium
      - run: >
          pnpm nx affected -t lint,test,build,test-storybook
          --base=${{ github.event.pull_request.base.sha }} --head=HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-affected
          path: |
            coverage/
            reports/
          if-no-files-found: ignore

  e2e-affected:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # PR tier: playwright.config.ts reads E2E_TIER=pr and limits the run to
      # the chromium + mobile-chromium projects and the critical journeys.
      - env:
          E2E_TIER: pr
        run: >
          pnpm nx affected -t e2e
          --base=${{ github.event.pull_request.base.sha }} --head=HEAD
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/*-e2e/playwright-report/
            apps/*-e2e/test-results/
          if-no-files-found: ignore

  verify-all:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nx run-many -t lint,test,build
      # UI libraries: the packaging gate and the Storybook axe run.
      - run: pnpm verify:packaging
      - run: pnpm nx test-storybook ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-all
          path: |
            coverage/
            reports/
          if-no-files-found: ignore

# Manual visual-snapshot regeneration. Run it from the Actions tab on a PR
# branch. It regenerates snapshots on the CI image (local snapshots differ by
# font rendering) and commits them to that branch for review.
name: e2e-visual-update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshots:
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - run: pnpm nx run-many -t e2e -- --update-snapshots
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'apps/*-e2e/**/*-snapshots/**'
          git diff --cached --quiet || git commit -m "Update visual snapshots"
          git push
